<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work Commerce Demo</title>
  <style>
    :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; padding: 24px; background: #11100e; color: #f4efe5; }
    .card { max-width: 560px; margin: 0 auto; border: 1px solid #2f2a22; background: #181613; border-radius: 14px; padding: 20px; }
    .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #aaa196; }
    h1 { margin: 8px 0 10px; font-size: 28px; }
    p { color: #c6bfb5; line-height: 1.6; }
    .meta { display: grid; gap: 10px; margin: 18px 0; }
    .row { display: flex; justify-content: space-between; gap: 12px; border: 1px solid #2a261f; background: #211f1a; border-radius: 10px; padding: 12px 14px; }
    .label { color: #8f8679; font-size: 12px; }
    .value { font-size: 14px; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
    button { height: 42px; border: 0; border-radius: 10px; background: #ff5a1f; color: #1b0d05; font-weight: 700; padding: 0 16px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .hint { margin-top: 12px; font-size: 12px; color: #8f8679; }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Best-practice example</div>
    <h1>Work Commerce Demo</h1>
    <p>Hardcode a Space-owned product key and benefit key, let the outer host own checkout, and query order state by id after return.</p>
    <div class="meta">
      <div class="row"><span class="label">Product</span><span id="product" class="value">Loading…</span></div>
      <div class="row"><span class="label">Entitlement</span><span id="entitlement" class="value">Loading…</span></div>
      <div class="row"><span class="label">Checkout</span><span id="checkout" class="value">Idle</span></div>
      <div class="row"><span class="label">Order</span><span id="order" class="value mono">—</span></div>
    </div>
    <button id="buy">Buy unlock</button>
    <div class="hint">Set <span class="mono">PRODUCT_KEY</span> and <span class="mono">BENEFIT_KEY</span> for your own Work.</div>
  </main>

  <script type="module">
    const PRODUCT_KEY = "pro_unlock";
    const BENEFIT_KEY = "space_pro";
    const SDK_URL = "https://esm.sh/@neta-art/cohub?bundle&target=es2022";

    const productEl = document.getElementById("product");
    const entitlementEl = document.getElementById("entitlement");
    const checkoutEl = document.getElementById("checkout");
    const orderEl = document.getElementById("order");
    const buyBtn = document.getElementById("buy");

    const { createCohubClient } = await import(SDK_URL);
    const cohub = createCohubClient();

    async function render() {
      const [{ products }, { entitlements }, checkoutState] = await Promise.all([
        cohub.work.commerce.resolveProducts({ productKeys: [PRODUCT_KEY] }),
        cohub.work.commerce.checkEntitlements({ benefitKeys: [BENEFIT_KEY] }),
        cohub.work.commerce.getCheckoutState(),
      ]);

      const product = products[0] ?? null;
      const entitlement = entitlements.find((item) => item.benefitKey === BENEFIT_KEY) ?? null;

      productEl.textContent = product
        ? `${product.name} · $${product.pricing.amountUsd.toFixed(2)}`
        : "Unavailable";

      entitlementEl.textContent = entitlement?.enabled ? "Unlocked" : "Locked";
      checkoutEl.textContent = checkoutState.status ? `${checkoutState.status}` : "Idle";
      orderEl.textContent = checkoutState.orderId ?? "—";

      if (checkoutState.orderId) {
        try {
          const { order } = await cohub.work.commerce.getOrder(checkoutState.orderId);
          checkoutEl.textContent = `${checkoutState.status ?? "returned"} · ${order.status}`;
          orderEl.textContent = order.id;
        } catch (error) {
          checkoutEl.textContent = error instanceof Error ? error.message : "Order lookup failed";
        }
      }

      const unlocked = entitlement?.enabled === true;
      buyBtn.disabled = unlocked || !product;
      if (unlocked) buyBtn.textContent = "Already unlocked";
    }

    buyBtn.onclick = async () => {
      buyBtn.disabled = true;
      try {
        const checkout = await cohub.work.commerce.purchase({ productKey: PRODUCT_KEY });
        if (!checkout?.checkoutUsable) {
          checkoutEl.textContent = checkout?.message ?? "Checkout unavailable";
          buyBtn.disabled = false;
        }
      } catch (error) {
        checkoutEl.textContent = error instanceof Error ? error.message : "Purchase failed";
        buyBtn.disabled = false;
      }
    };

    render().catch((error) => {
      checkoutEl.textContent = error instanceof Error ? error.message : "Failed to load";
      buyBtn.disabled = true;
    });
  </script>
</body>
</html>
