<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cohub New Chat Background</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        font-family: sans-serif;
      }

      main {
        display: grid;
        gap: 12px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>New chat</h1>
      <button type="button" id="fill">Fill composer</button>
    </main>

    <script>
      document.getElementById("fill").addEventListener("click", () => {
        window.parent.postMessage(
          {
            source: "cohub.newChat",
            version: 1,
            type: "composer.apply",
            payload: {
              prompt: "Summarize this Space and suggest the next three actions.",
              model: {
                provider: "cohub",
                id: "deepseek-v4-pro"
              }
            }
          },
          "*"
        );
      });
    </script>
  </body>
</html>
