<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="cohub:surface" content="overlay" />
  <!-- Follow the host theme: a mismatched color-scheme makes Chromium paint an
       opaque backdrop behind the frame and the overlay loses its transparency. -->
  <meta name="color-scheme" content="light dark" />
  <title>Agent HUD</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Geist", system-ui, -apple-system, sans-serif;
      font-size: 12px;
    }

    /* ── Panel ────────────────────────────────────────────────────── */
    #hud {
      position: absolute;
      top: 0;
      right: 0;
      width: 260px;
      border-radius: 12px;
      /* Solid, not blurred: an overlay floats over content that changes every
         frame while the agent streams, and backdrop-filter would re-blur it all
         for as long as the panel is visible. */
      background: oklch(14% 0.01 255 / 96%);
      border: 1px solid oklch(28% 0.04 255);
      box-shadow:
        0 4px 24px oklch(0% 0 0 / 28%),
        inset 0 1px 0 oklch(40% 0.04 255 / 20%);
      color: oklch(88% 0.01 255);
      overflow: hidden;
      /* Slide in */
      animation: slide-in 220ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slide-in {
      from { transform: translateX(20px); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }

    /* ── Header ───────────────────────────────────────────────────── */
    .hud-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px 8px;
      border-bottom: 1px solid oklch(28% 0.04 255 / 60%);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: oklch(72% 0.18 145);
      flex-shrink: 0;
      transition: background 300ms ease;
    }
    .status-dot.thinking { background: oklch(72% 0.16 55); animation: pulse 1.2s ease-in-out infinite; }
    .status-dot.idle     { background: oklch(60% 0.01 255); }
    .status-dot.error    { background: oklch(68% 0.2 25); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.45; }
    }

    .hud-title {
      flex: 1;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: oklch(92% 0.01 255);
    }

    .hud-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: oklch(60% 0.02 255);
      cursor: pointer;
      transition: background 100ms ease, color 100ms ease;
      font-size: 14px;
      line-height: 1;
    }
    .hud-close:hover { background: oklch(28% 0.04 255); color: oklch(88% 0.01 255); }

    /* ── Status line ─────────────────────────────────────────────── */
    .hud-status {
      padding: 8px 12px 6px;
      font-size: 11px;
      color: oklch(68% 0.03 255);
      min-height: 26px;
      line-height: 1.4;
      transition: color 200ms ease;
    }
    .hud-status.active { color: oklch(82% 0.04 255); }

    .hud-hint {
      padding: 0 12px 8px;
      font-size: 10.5px;
      line-height: 1.5;
      color: oklch(55% 0.02 255);
    }
    .hud-hint code {
      display: block;
      margin-top: 4px;
      font-family: "Geist Mono", "Fira Code", ui-monospace, monospace;
      font-size: 10px;
      color: oklch(70% 0.04 255);
      word-break: break-all;
    }
    .hud-hint:empty { display: none; }

    /* ── Tool call list ──────────────────────────────────────────── */
    .hud-tools {
      list-style: none;
      padding: 0 8px 6px;
      max-height: 120px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: oklch(32% 0.04 255) transparent;
    }

    .tool-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 4px 6px;
      border-radius: 6px;
      transition: background 100ms ease;
      cursor: default;
    }
    .tool-item:hover { background: oklch(22% 0.03 255); }

    .tool-icon {
      font-size: 11px;
      width: 14px;
      text-align: center;
      flex-shrink: 0;
    }

    .tool-name {
      flex: 1;
      font-size: 11px;
      font-family: "Geist Mono", "Fira Code", ui-monospace, monospace;
      color: oklch(80% 0.05 255);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tool-state {
      font-size: 10px;
      color: oklch(55% 0.02 255);
      flex-shrink: 0;
    }
    .tool-state.running { color: oklch(72% 0.16 55); }
    .tool-state.done    { color: oklch(70% 0.14 145); }
    .tool-state.error   { color: oklch(68% 0.2 25); }

    /* ── Quick actions ───────────────────────────────────────────── */
    .hud-actions {
      display: flex;
      gap: 6px;
      padding: 6px 8px 10px;
      border-top: 1px solid oklch(28% 0.04 255 / 60%);
    }

    .action-btn {
      flex: 1;
      padding: 5px 8px;
      border: 1px solid oklch(30% 0.04 255);
      border-radius: 6px;
      background: oklch(20% 0.03 255);
      color: oklch(78% 0.03 255);
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      transition: background 100ms ease, border-color 100ms ease, color 100ms ease;
    }
    .action-btn:hover {
      background: oklch(28% 0.05 255);
      border-color: oklch(40% 0.06 255);
      color: oklch(90% 0.02 255);
    }
    .action-btn:active { transform: translateY(1px); }

    /* Ping notification flash */
    .ping-flash {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      border: 1.5px solid oklch(72% 0.16 55);
      animation: ping-ring 600ms ease-out forwards;
      pointer-events: none;
    }
    @keyframes ping-ring {
      from { opacity: 1; }
      to   { opacity: 0; transform: scale(1.02); }
    }

    @media (prefers-reduced-motion: reduce) {
      .hud  { animation: none; }
      .status-dot.thinking { animation: none; }
    }

    /* Scrollbar style */
    .hud-tools::-webkit-scrollbar { width: 4px; }
    .hud-tools::-webkit-scrollbar-thumb { background: oklch(32% 0.04 255); border-radius: 2px; }
  </style>
</head>
<body>

<aside id="hud" aria-label="Agent HUD">
  <div class="hud-header">
    <div class="status-dot" id="dot"></div>
    <span class="hud-title">Agent</span>
    <button type="button" class="hud-close" id="close-btn" aria-label="Close HUD" title="Close">×</button>
  </div>
  <div class="hud-status" id="status-line">Waiting for the agent…</div>
  <div class="hud-hint" id="hint"></div>
  <ul class="hud-tools" id="tool-list" aria-label="Recent tool calls"></ul>
  <div class="hud-actions">
    <button type="button" class="action-btn" id="btn-session" title="Open the Chat this HUD follows">Open chat</button>
    <button type="button" class="action-btn" id="btn-dismiss" title="Close this HUD">Dismiss</button>
  </div>
</aside>

<script type="module">
  // ── SDK ──────────────────────────────────────────────────────────
  // Try each CDN in turn: a freshly published SDK can take a while for one
  // builder to produce, and a failed import aborts this whole module before
  // the HUD can wire up its buttons. jsDelivr first, esm.sh as a fallback.
  const SDK_URLS = [
    "https://cdn.jsdelivr.net/npm/@neta-art/cohub/+esm",
    "https://esm.sh/@neta-art/cohub?bundle&target=es2022",
  ];
  async function loadCohub() {
    let lastError;
    for (const url of SDK_URLS) {
      try {
        return await import(url);
      } catch (cause) {
        lastError = cause;
      }
    }
    throw lastError;
  }
  const { createCohubClient } = await loadCohub();
  const cohub = createCohubClient();
  let context = await cohub.context();

  // ── DOM refs ─────────────────────────────────────────────────────
  const hud = document.getElementById("hud");
  const dot = document.getElementById("dot");
  const statusLine = document.getElementById("status-line");
  const hint = document.getElementById("hint");
  const toolList = document.getElementById("tool-list");
  const btnSession = document.getElementById("btn-session");
  const btnDismiss = document.getElementById("btn-dismiss");
  const closeBtn = document.getElementById("close-btn");

  // ── State ────────────────────────────────────────────────────────
  let runState = "idle"; // idle | thinking | done | error
  let customStatus = null; // last `hud.ping` message, shown instead of the generic status
  const tools = []; // [{ id, name, state }]
  const MAX_TOOLS = 12;

  // ── Geometry ─────────────────────────────────────────────────────
  // A fixed panel shrinks the overlay to its own size and takes input
  // everywhere inside it. Unlike a rect list, `"all"` needs no hover to
  // activate, so it works on touch screens too.
  const PANEL = { anchor: "top-right", x: 12, y: 12, width: 260 };

  function reportGeometry() {
    cohub.app.requestConfigure({
      geometry: { ...PANEL, height: Math.ceil(hud.getBoundingClientRect().height) },
      inputRegion: "all",
    });
  }

  requestAnimationFrame(reportGeometry);

  // ── Render ───────────────────────────────────────────────────────
  const stateIcon = { running: "⟳", done: "✓", error: "✕" };
  const statusText = {
    idle: "Waiting for the agent…",
    thinking: "Agent is working…",
    done: "Run complete.",
    error: "An error occurred.",
  };
  const PING_EXAMPLE =
    "cohub desktop open <this-app> --call hud.ping --data '{\"message\":\"Hi\"}'";

  // What this HUD is for, shown until there is something live to display.
  function renderHint() {
    if (!context) {
      hint.textContent = "Open this App from a Cohub workspace to follow a Chat.";
    } else if (!context.shell?.session?.id) {
      hint.textContent = "Open a Chat and this HUD follows it.";
    } else if (authDenied) {
      hint.textContent = "Access was declined. Reopen the HUD to grant it.";
    } else if (runState === "idle" && tools.length === 0) {
      const code = document.createElement("code");
      code.textContent = PING_EXAMPLE;
      hint.replaceChildren(
        "Lists this Chat's tool calls live while the agent runs. Send a message, or ping it from a shell:",
        code,
      );
    } else {
      hint.replaceChildren();
    }
  }

  // Two render levels. Streaming patches arrive per token, so `renderStatus`
  // touches only the header; the list, hint and overlay size are rebuilt by
  // `render` when something they show actually changed.
  function renderStatus() {
    dot.className =
      "status-dot " +
      (runState === "thinking"
        ? "thinking"
        : runState === "error"
          ? "error"
          : runState === "done"
            ? ""
            : "idle");
    statusLine.textContent = customStatus ?? statusText[runState];
    statusLine.className = `hud-status${runState === "thinking" ? " active" : ""}`;
  }

  function render() {
    renderStatus();
    renderHint();

    toolList.replaceChildren(
      ...tools.slice(-MAX_TOOLS).map((tool) => {
        const item = document.createElement("li");
        item.className = "tool-item";
        const icon = document.createElement("span");
        icon.className = "tool-icon";
        icon.textContent = stateIcon[tool.state] ?? "·";
        const name = document.createElement("span");
        name.className = "tool-name";
        name.textContent = tool.name;
        const state = document.createElement("span");
        state.className = `tool-state ${tool.state}`;
        state.textContent = tool.state;
        item.append(icon, name, state);
        return item;
      }),
    );
    toolList.scrollTop = toolList.scrollHeight;

    // The panel may have grown; resize the overlay to match.
    requestAnimationFrame(reportGeometry);
  }
  // ── Follow the Chat ──────────────────────────────────────────────
  // The HUD follows whatever Space the viewer is looking at, which is rarely
  // the App's own home Space. App-side scopes only apply at home, so it asks
  // the viewer for `space.view` (realtime events) and `session.view` on the
  // current Space. The first time this shows a consent dialog; later opens
  // reuse the grant silently.
  const FOLLOW_SCOPES = ["space.view", "session.view"];
  // One consent outcome per Space: an in-flight request is shared, a denial
  // sticks. Asking again while a dialog is open would replace that dialog.
  const followAccess = new Map(); // spaceId -> Promise<boolean>
  let authDenied = false;
  let followed = null; // { spaceId, sessionId, stop }

  function ensureFollowAccess(spaceId) {
    let pending = followAccess.get(spaceId);
    if (!pending) {
      pending = cohub.auth
        .request({
          scopes: FOLLOW_SCOPES,
          spaceId,
          reason: "Follow the current Chat's live agent activity.",
        })
        .catch(() => false);
      followAccess.set(spaceId, pending);
    }
    return pending;
  }

  async function followSession() {
    const spaceId = context?.shell?.space?.id ?? null;
    const sessionId = context?.shell?.session?.id ?? null;
    // Only a different Space or Chat needs a new subscription; turn changes
    // and other context updates keep the current one.
    if (followed?.spaceId === spaceId && followed?.sessionId === sessionId) return;
    followed?.stop?.();
    followed = { spaceId, sessionId, stop: null };
    customStatus = null;
    if (!spaceId || !sessionId) return render();

    const granted = await ensureFollowAccess(spaceId);
    // The Chat may have changed while the dialog was open.
    if (followed.spaceId !== spaceId || followed.sessionId !== sessionId) return;
    authDenied = !granted;
    if (!granted) return render();

    followed.stop = cohub
      .space(spaceId)
      .session(sessionId)
      .subscribe({
        // Streaming patches mark the run as active and carry tool activity.
        patch: ({ payload }) => {
          const wasIdle = runState !== "thinking";
          runState = "thinking";
          let toolsChanged = false;
          for (const op of payload?.ops ?? []) {
            // Patch ops carry their payload in `v`; see RealtimePatchOperation.
            const value = op?.v;
            if (value?.type === "tool_use" && typeof value.name === "string") {
              const existing = tools.find((tool) => tool.id === value.id);
              if (existing) existing.state = "running";
              else tools.push({ id: value.id, name: value.name, state: "running" });
              toolsChanged = true;
            }
            if (value?.type === "tool_result" && value.tool_use_id) {
              const tool = tools.find((tool) => tool.id === value.tool_use_id);
              if (tool) {
                tool.state = value.is_error ? "error" : "done";
                toolsChanged = true;
              }
            }
          }
          // Most patches are text tokens: they only need the status strip.
          if (toolsChanged || wasIdle) render();
          else renderStatus();
        },
        // A failed turn, or a rejected subscription (e.g. missing permission).
        error: (event) => {
          runState = "error";
          customStatus =
            event.type === "system.subscribe.error"
              ? `Cannot follow this Chat: ${event.payload?.rejected?.[0]?.message ?? "subscription rejected"}`
              : event.payload?.message ?? null;
          render();
        },
        turnFinalized: () => {
          runState = "done";
          customStatus = null;
          for (const tool of tools) if (tool.state === "running") tool.state = "done";
          render();
          // Auto-close after a short pause.
          setTimeout(() => cohub.app.requestClose(), 4000);
        },
      });
    render();
  }

  followSession();
  cohub.app.onContextChanged((next) => {
    context = next;
    followSession();
  });
  // ── Surface method: an agent can push a status line ──────────────
  // cohub desktop open <this-app> --call hud.ping --data '{"message":"Deploying…"}'
  cohub.app.surface.handle("hud.ping", async ({ message, state }, { commandId }) => {
    if (typeof message === "string") customStatus = message;
    runState = state === "error" || state === "done" ? state : "thinking";
    render();

    const flash = document.createElement("div");
    flash.className = "ping-flash";
    hud.appendChild(flash);
    setTimeout(() => flash.remove(), 700);
    // Settle the desktop command so the caller's `cohub desktop open` returns.
    await cohub.desktop.reportResult(commandId, { status: "applied", result: null, error: null });
  });

  // ── Buttons ──────────────────────────────────────────────────────
  btnSession.addEventListener("click", () => {
    const sessionId = context?.shell?.session?.id;
    const spaceId = context?.shell?.space?.id;
    if (sessionId && spaceId) cohub.navigation.open({ kind: "session", spaceId, sessionId });
  });
  btnDismiss.addEventListener("click", () => cohub.app.requestClose());
  closeBtn.addEventListener("click", () => cohub.app.requestClose());

  render();
</script>
</body>
</html>
