<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="cohub:surface" content="overlay" />
  <title>Agent HUD</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Geist", system-ui, -apple-system, sans-serif;
      font-size: 12px;
    }

    /* ── Panel ────────────────────────────────────────────────────── */
    #hud {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 260px;
      border-radius: 12px;
      background: oklch(14% 0.01 255 / 88%);
      border: 1px solid oklch(28% 0.04 255);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow:
        0 4px 24px oklch(0% 0 0 / 28%),
        inset 0 1px 0 oklch(40% 0.04 255 / 20%);
      color: oklch(88% 0.01 255);
      overflow: hidden;
      /* Slide in */
      animation: slide-in 220ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slide-in {
      from { transform: translateX(20px); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }

    /* ── Header ───────────────────────────────────────────────────── */
    .hud-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px 8px;
      border-bottom: 1px solid oklch(28% 0.04 255 / 60%);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: oklch(72% 0.18 145);
      flex-shrink: 0;
      transition: background 300ms ease;
    }
    .status-dot.thinking { background: oklch(72% 0.16 55); animation: pulse 1.2s ease-in-out infinite; }
    .status-dot.idle     { background: oklch(60% 0.01 255); }
    .status-dot.error    { background: oklch(68% 0.2 25); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.45; }
    }

    .hud-title {
      flex: 1;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: oklch(92% 0.01 255);
    }

    .hud-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: oklch(60% 0.02 255);
      cursor: pointer;
      transition: background 100ms ease, color 100ms ease;
      font-size: 14px;
      line-height: 1;
    }
    .hud-close:hover { background: oklch(28% 0.04 255); color: oklch(88% 0.01 255); }

    /* ── Status line ─────────────────────────────────────────────── */
    .hud-status {
      padding: 8px 12px 6px;
      font-size: 11px;
      color: oklch(68% 0.03 255);
      min-height: 26px;
      line-height: 1.4;
      transition: color 200ms ease;
    }
    .hud-status.active { color: oklch(82% 0.04 255); }

    /* ── Tool call list ──────────────────────────────────────────── */
    .hud-tools {
      list-style: none;
      padding: 0 8px 6px;
      max-height: 120px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: oklch(32% 0.04 255) transparent;
    }

    .tool-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 4px 6px;
      border-radius: 6px;
      transition: background 100ms ease;
      cursor: default;
    }
    .tool-item:hover { background: oklch(22% 0.03 255); }

    .tool-icon {
      font-size: 11px;
      width: 14px;
      text-align: center;
      flex-shrink: 0;
    }

    .tool-name {
      flex: 1;
      font-size: 11px;
      font-family: "Geist Mono", "Fira Code", ui-monospace, monospace;
      color: oklch(80% 0.05 255);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tool-state {
      font-size: 10px;
      color: oklch(55% 0.02 255);
      flex-shrink: 0;
    }
    .tool-state.running { color: oklch(72% 0.16 55); }
    .tool-state.done    { color: oklch(70% 0.14 145); }
    .tool-state.error   { color: oklch(68% 0.2 25); }

    /* ── Quick actions ───────────────────────────────────────────── */
    .hud-actions {
      display: flex;
      gap: 6px;
      padding: 6px 8px 10px;
      border-top: 1px solid oklch(28% 0.04 255 / 60%);
    }

    .action-btn {
      flex: 1;
      padding: 5px 8px;
      border: 1px solid oklch(30% 0.04 255);
      border-radius: 6px;
      background: oklch(20% 0.03 255);
      color: oklch(78% 0.03 255);
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      transition: background 100ms ease, border-color 100ms ease, color 100ms ease;
    }
    .action-btn:hover {
      background: oklch(28% 0.05 255);
      border-color: oklch(40% 0.06 255);
      color: oklch(90% 0.02 255);
    }
    .action-btn:active { transform: translateY(1px); }

    /* Ping notification flash */
    .ping-flash {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      border: 1.5px solid oklch(72% 0.16 55);
      animation: ping-ring 600ms ease-out forwards;
      pointer-events: none;
    }
    @keyframes ping-ring {
      from { opacity: 1; }
      to   { opacity: 0; transform: scale(1.02); }
    }

    @media (prefers-reduced-motion: reduce) {
      .hud  { animation: none; }
      .status-dot.thinking { animation: none; }
    }

    /* Scrollbar style */
    .hud-tools::-webkit-scrollbar { width: 4px; }
    .hud-tools::-webkit-scrollbar-thumb { background: oklch(32% 0.04 255); border-radius: 2px; }
  </style>
</head>
<body>

<div id="hud" role="complementary" aria-label="Agent HUD">
  <div class="hud-header">
    <div class="status-dot" id="dot"></div>
    <span class="hud-title">Agent</span>
    <button class="hud-close" id="close-btn" aria-label="Close HUD" title="Close">×</button>
  </div>
  <div class="hud-status" id="status-line">Waiting for the agent…</div>
  <ul class="hud-tools" id="tool-list" aria-label="Recent tool calls"></ul>
  <div class="hud-actions">
    <button class="action-btn" id="btn-session" title="Open current session">Session</button>
    <button class="action-btn" id="btn-dismiss" title="Dismiss HUD">Dismiss</button>
  </div>
</div>

<script type="module">
  // ── SDK ──────────────────────────────────────────────────────────
  const SDK_URL = "https://esm.sh/@neta-art/cohub?bundle&target=es2022";
  const { createCohubClient } = await import(SDK_URL);
  const cohub = createCohubClient();
  const context = await cohub.context();

  // ── DOM refs ─────────────────────────────────────────────────────
  const hud        = document.getElementById("hud");
  const dot        = document.getElementById("dot");
  const statusLine = document.getElementById("status-line");
  const toolList   = document.getElementById("tool-list");
  const btnSession = document.getElementById("btn-session");
  const btnDismiss = document.getElementById("btn-dismiss");
  const closeBtn   = document.getElementById("close-btn");

  // ── State ────────────────────────────────────────────────────────
  let runState = "idle"; // idle | thinking | done | error
  let tools = [];        // [{ name, state }]
  const MAX_TOOLS = 12;

  const HUD_W = 260;
  const HUD_H = 220; // approximate — measured on first render

  // ── Register hit region once the DOM has a known size ────────────
  function reportGeometry() {
    const rect = hud.getBoundingClientRect();
    cohub.app.requestConfigure({
      geometry: {
        anchor: "top-right",
        x: 12,
        y: 12,
        width: Math.round(rect.width) || HUD_W,
        height: Math.round(rect.height) || HUD_H,
      },
      // Pointer events exactly over the panel.
      inputRegion: [{
        x: window.innerWidth - 12 - (Math.round(rect.width) || HUD_W),
        y: 12,
        width: Math.round(rect.width) || HUD_W,
        height: Math.round(rect.height) || HUD_H,
      }],
    });
  }

  // Give the browser one frame to lay out.
  requestAnimationFrame(reportGeometry);
  window.addEventListener("resize", reportGeometry);

  // ── Render ───────────────────────────────────────────────────────
  const stateIcon  = { running: "⟳", done: "✓", error: "✕", pending: "·" };
  const stateLabel = { running: "running", done: "done", error: "error", pending: "…" };

  function render() {
    // Status dot
    dot.className = "status-dot " + (runState === "thinking" ? "thinking" : runState === "error" ? "error" : runState === "done" ? "" : "idle");

    // Status text
    const msgs = {
      idle:     "Waiting for the agent…",
      thinking: "Agent is working…",
      done:     "Run complete.",
      error:    "An error occurred.",
    };
    statusLine.textContent = msgs[runState] || "";
    statusLine.className = "hud-status" + (runState === "thinking" ? " active" : "");

    // Tool list
    const recent = tools.slice(-MAX_TOOLS);
    toolList.innerHTML = recent.map(t => `
      <li class="tool-item">
        <span class="tool-icon">${stateIcon[t.state] ?? "·"}</span>
        <span class="tool-name">${t.name}</span>
        <span class="tool-state ${t.state}">${stateLabel[t.state] ?? ""}</span>
      </li>
    `).join("");
    toolList.scrollTop = toolList.scrollHeight;

    // Recalculate hit region after DOM update.
    requestAnimationFrame(reportGeometry);
  }

  // ── Real-time: subscribe to the current session ───────────────────
  async function subscribeSession(sessionId) {
    if (!context || !sessionId) return;
    const spaceId = context.invocation?.spaceId ?? context.shell?.space?.id;
    if (!spaceId) return;
    const session = cohub.space(spaceId).session(sessionId);

    session.subscribe({
      progress: ({ payload }) => {
        if (!payload) return;
        if (payload.type === "generating") {
          runState = "thinking";
        }
        // Tool calls come through as intermediate messages.
        if (payload.type === "tool_call" && payload.name) {
          const existing = tools.find(t => t.id === payload.id);
          if (existing) {
            existing.state = "running";
          } else {
            tools.push({ id: payload.id ?? Math.random(), name: payload.name, state: "running" });
          }
        }
        if (payload.type === "tool_result" && payload.toolCallId) {
          const t = tools.find(t => t.id === payload.toolCallId);
          if (t) t.state = payload.error ? "error" : "done";
        }
        render();
      },
      finalized: () => {
        runState = "done";
        // Mark any still-running tools as done.
        tools.forEach(t => { if (t.state === "running") t.state = "done"; });
        render();
        // Auto-close after a short pause.
        setTimeout(() => {
          cohub.app.requestClose();
        }, 4000);
      },
    });
  }

  // Initial session from shell context.
  const initialSession = context?.shell?.session?.id;
  if (initialSession) subscribeSession(initialSession);

  // Re-subscribe when the shell location changes.
  cohub.app.onContextChanged(ctx => {
    const newSession = ctx?.shell?.session?.id;
    if (newSession && newSession !== initialSession) subscribeSession(newSession);
  });

  // ── Surface method: agent can push a status ping ──────────────────
  cohub.app.surface.handle("hud.ping", async ({ message, state }) => {
    if (typeof message === "string") {
      statusLine.textContent = message;
      statusLine.className = "hud-status active";
    }
    if (state === "error") runState = "error";
    else if (state === "done") runState = "done";
    else runState = "thinking";
    render();

    // Visual flash.
    const flash = document.createElement("div");
    flash.className = "ping-flash";
    hud.appendChild(flash);
    setTimeout(() => flash.remove(), 700);

    return { received: true };
  });

  // ── Buttons ───────────────────────────────────────────────────────
  btnSession.addEventListener("click", async () => {
    const sessionId = context?.shell?.session?.id;
    const spaceId   = context?.invocation?.spaceId ?? context?.shell?.space?.id;
    if (!sessionId || !spaceId) return;
    await cohub.open({ kind: "session", spaceId, sessionId });
  });

  btnDismiss.addEventListener("click", () => cohub.app.requestClose());
  closeBtn.addEventListener("click",   () => cohub.app.requestClose());

  // Initial render.
  render();
</script>
</body>
</html>
