schema: cohub.generation.v1

model: seedance-2-0-fast
title: Seedance 2.0 Fast
description: Fast Ark video generation model for drafts, rapid iteration, text-to-video, image-to-video, and reference-guided video generation.

adapter:
  type: ark.videoGenerations
  base_url: https://router.neta.art/v1
  api_key: $env:NETA_ROUTER_API_KEY

content:
  input:
    - type: text
      required: true
      min: 1
      max: 16
      merge: newline
      description: Video prompt.

    - type: image
      required: false
      max: 9
      sources:
        - url
        - base64
        - space_file
      description: Optional image input. Use _meta.role as first_frame, last_frame, or reference_image.

parameters:
  duration:
    type: integer
    optional: true
    default: 5
    min: 4
    max: 15
    description: Video duration in seconds.

  resolution:
    type: string
    optional: true
    default: 720p
    enum:
      - 480p
      - 720p
      - 1080p
      - 2K
    description: Output video resolution.

  aspect_ratio:
    type: string
    optional: true
    default: "16:9"
    enum:
      - "16:9"
      - "9:16"
      - "1:1"
      - "4:3"
      - "3:2"
      - "2:3"
      - "3:4"
      - "21:9"
      - adaptive
    description: Output aspect ratio. Use adaptive to let the model choose.

  fps:
    type: integer
    optional: true
    default: 30
    min: 1
    max: 60
    description: Frames per second.

  seed:
    type: integer
    optional: true
    description: Random seed for reproducibility.

  generate_audio:
    type: boolean
    optional: true
    default: true
    description: Generate synchronized audio.

  return_last_frame:
    type: boolean
    optional: true
    default: true
    description: Return the last frame as an image for chaining video segments.

  camera_fixed:
    type: boolean
    optional: true
    default: false
    description: Fix camera position when supported.

  watermark:
    type: boolean
    optional: true
    default: false
    description: Add AI Generated watermark.

  poll_interval:
    type: integer
    optional: true
    default: 2
    min: 1
    max: 30
    description: Seconds between task status checks.

  max_wait:
    type: integer
    optional: true
    default: 600
    min: 30
    max: 1800
    description: Maximum seconds to wait for task completion.

examples:
  - title: Text to video
    request:
      model: seedance-2-0-fast
      content:
        - type: text
          text: a cat playing piano in a cozy jazz club, cinematic lighting, smooth camera movement
      parameters:
        duration: 5
        resolution: 720p
        aspect_ratio: "16:9"

  - title: Image to video with first frame
    request:
      model: seedance-2-0-fast
      content:
        - type: text
          text: camera slowly pans right, warm sunset lighting, subtle fabric movement
        - type: image
          source:
            type: url
            url: https://example.com/start.jpg
          _meta:
            role: first_frame
      parameters:
        duration: 5
        resolution: 720p
        aspect_ratio: "16:9"

  - title: Reference images for character consistency
    request:
      model: seedance-2-0-fast
      content:
        - type: text
          text: two original fantasy characters exploring a luminous forest, gentle handheld camera
        - type: image
          source:
            type: url
            url: https://example.com/character-a.jpg
          _meta:
            role: reference_image
        - type: image
          source:
            type: url
            url: https://example.com/character-b.jpg
          _meta:
            role: reference_image
      parameters:
        duration: 5
        resolution: 720p
        aspect_ratio: "16:9"
        generate_audio: false
