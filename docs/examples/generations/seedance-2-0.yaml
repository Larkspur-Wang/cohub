schema: cohub.generation.v1

model: seedance-2-0
title: Seedance 2.0
description: Higher quality Ark video generation model for final production outputs.

adapter:
  type: ark.videoGenerations
  base_url: https://router.neta.art/v1
  api_key: $env:NETA_ROUTER_API_KEY

content:
  input:
    - type: text
      required: true
      min: 1
      max: 16
      merge: newline
      description: Video prompt.

    - type: image
      required: false
      max: 9
      sources:
        - url
        - base64
        - space_file
      description: Optional image input. Use _meta.role as first_frame, last_frame, or reference_image.

parameters:
  duration:
    type: integer
    optional: true
    default: 5
    min: 4
    max: 15
    description: Video duration in seconds.

  resolution:
    type: string
    optional: true
    default: 1080p
    enum:
      - 480p
      - 720p
      - 1080p
      - 2K
    description: Output video resolution.

  aspect_ratio:
    type: string
    optional: true
    default: "16:9"
    enum:
      - "16:9"
      - "9:16"
      - "1:1"
      - "4:3"
      - "3:2"
      - "2:3"
      - "3:4"
      - "21:9"
      - adaptive
    description: Output aspect ratio. Use adaptive to let the model choose.

  fps:
    type: integer
    optional: true
    default: 30
    min: 1
    max: 60
    description: Frames per second.

  seed:
    type: integer
    optional: true
    description: Random seed for reproducibility.

  generate_audio:
    type: boolean
    optional: true
    default: true
    description: Generate synchronized audio.

  return_last_frame:
    type: boolean
    optional: true
    default: true
    description: Return the last frame as an image for chaining video segments.

  camera_fixed:
    type: boolean
    optional: true
    default: false
    description: Fix camera position when supported.

  watermark:
    type: boolean
    optional: true
    default: false
    description: Add AI Generated watermark.

  poll_interval:
    type: integer
    optional: true
    default: 2
    min: 1
    max: 30
    description: Seconds between task status checks.

  max_wait:
    type: integer
    optional: true
    default: 900
    min: 30
    max: 1800
    description: Maximum seconds to wait for task completion.

examples:
  - title: Text to video
    request:
      model: seedance-2-0
      content:
        - type: text
          text: a serene mountain lake at dawn, mist drifting over the water, cinematic camera movement
      parameters:
        duration: 5
        resolution: 1080p
        aspect_ratio: "16:9"

  - title: First and last frame transition
    request:
      model: seedance-2-0
      content:
        - type: text
          text: create a smooth dramatic transition from the first frame to the last frame
        - type: image
          source:
            type: url
            url: https://example.com/start.jpg
          _meta:
            role: first_frame
        - type: image
          source:
            type: url
            url: https://example.com/end.jpg
          _meta:
            role: last_frame
      parameters:
        duration: 8
        resolution: 1080p
        aspect_ratio: "16:9"
        return_last_frame: true
