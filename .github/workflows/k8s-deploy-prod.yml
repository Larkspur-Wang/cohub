name: K8s Deploy to Prod

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get release tag
        id: get-tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > ~/.kube/config
          kubectl config current-context
          kubectl get namespace cohub

      - name: Deploy API to Prod
        run: |
          cd deploy/api/prod
          OVERRIDE_IMAGE_TAG="${{ steps.get-tag.outputs.tag }}" \
          OVERRIDE_SANDBOX_IMAGE="git.talesofai.com/talesofai/cohub-agent:${{ steps.get-tag.outputs.tag }}" \
          ./deploy.sh

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/cohub-api -n cohub --timeout=300s
          kubectl get pods -n cohub -l app.kubernetes.io/name=cohub-api

  deploy-gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get release tag
        id: get-tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > ~/.kube/config
          kubectl config current-context
          kubectl get namespace cohub

      - name: Deploy Gateway to Prod
        run: |
          cd deploy/gateway/prod
          OVERRIDE_IMAGE_TAG="${{ steps.get-tag.outputs.tag }}" ./deploy.sh

      - name: Verify deployment
        run: |
          kubectl rollout status statefulset/cohub-gateway -n cohub --timeout=300s
          kubectl get pods -n cohub -l app.kubernetes.io/name=cohub-gateway

  deploy-web:
    # Web 部署到 Cloudflare Workers (Prod 环境)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup prod environment
        working-directory: apps/web
        run: |
          echo "PUBLIC_API_ORIGIN=https://api.cohub.run" > .env
          echo "PUBLIC_GATEWAY_ORIGIN=https://gateway.cohub.run" >> .env

      - name: Lint
        run: pnpm lint
        working-directory: apps/web

      - name: Typecheck
        run: pnpm typecheck
        working-directory: apps/web

      - name: Build
        run: pnpm build
        working-directory: apps/web

      - name: Deploy to Cloudflare Prod
        run: pnpm run deploy --config wrangler.prod.toml
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
