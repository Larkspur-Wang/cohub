name: K8s Deploy to Dev

on:
  workflow_run:
    workflows:
      - "API Docker Build and Push"
      - "Gateway Docker Build and Push"
      - "Agent Docker Build and Push"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-api:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.name == 'API Docker Build and Push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > ~/.kube/config
          kubectl config current-context
          kubectl get namespace cohub-dev

      - name: Deploy API to Dev
        run: |
          cd deploy/api/dev
          OVERRIDE_IMAGE_TAG="${{ github.sha }}" ./deploy.sh

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/cohub-api-dev -n cohub-dev --timeout=300s
          kubectl get pods -n cohub-dev -l app.kubernetes.io/name=cohub-api-dev

  deploy-gateway:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.name == 'Gateway Docker Build and Push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > ~/.kube/config
          kubectl config current-context
          kubectl get namespace cohub-dev

      - name: Deploy Gateway to Dev
        run: |
          cd deploy/gateway/dev
          OVERRIDE_IMAGE_TAG="${{ github.sha }}" ./deploy.sh

      - name: Verify deployment
        run: |
          kubectl rollout status statefulset/cohub-gateway-dev -n cohub-dev --timeout=300s
          kubectl get pods -n cohub-dev -l app.kubernetes.io/name=cohub-gateway-dev

  update-agent-image-ref:
    # Agent 镜像更新后，更新 API values.yaml 中的 SANDBOX_RUNTIME_IMAGE 引用
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.name == 'Agent Docker Build and Push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update API dev values.yaml
        run: |
          sed -i 's|SANDBOX_RUNTIME_IMAGE: "git.talesofai.com/talesofai/cohub-agent:.*"|SANDBOX_RUNTIME_IMAGE: "git.talesofai.com/talesofai/cohub-agent:${{ github.sha }}"|' deploy/api/dev/values.yaml

      - name: Show changes
        run: |
          grep "SANDBOX_RUNTIME_IMAGE" deploy/api/dev/values.yaml

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add deploy/api/dev/values.yaml
          git commit -m "chore: update dev agent image to ${{ github.sha }}" || echo "No changes to commit"
          git push
