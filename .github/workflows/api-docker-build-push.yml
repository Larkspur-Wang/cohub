name: API Docker Build and Push

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: git.talesofai.com
  NAMESPACE: ${{ secrets.GITEA_OWNER }}
  IMAGE_NAME: cohub-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @cohub/api lint

      - name: Typecheck
        run: pnpm --filter @cohub/api typecheck

      - name: Build (api)
        run: pnpm --filter @cohub/api build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GITEA_USERNAME }}
          password: ${{ secrets.GITEA_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-{{sha}}
            type=sha,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          cache-from: type=gha,scope=api-build
          cache-to: type=gha,mode=min,scope=api-build
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

  deploy-dev:
    needs: build-and-push
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > ~/.kube/config

      - name: Deploy to Dev
        run: |
          cd deploy/api/dev
          OVERRIDE_IMAGE_TAG="${{ github.sha }}" \
          OVERRIDE_SANDBOX_IMAGE="git.talesofai.com/talesofai/cohub-agent:${{ github.sha }}" \
          ./deploy.sh

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/cohub-api-dev -n cohub-dev --timeout=300s
          kubectl get pods -n cohub-dev -l app.kubernetes.io/name=cohub-api-dev

  deploy-prod:
    needs: build-and-push
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get release tag
        id: get-tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > ~/.kube/config

      - name: Deploy to Prod
        run: |
          cd deploy/api/prod
          OVERRIDE_IMAGE_TAG="${{ steps.get-tag.outputs.tag }}" \
          OVERRIDE_SANDBOX_IMAGE="git.talesofai.com/talesofai/cohub-agent:${{ steps.get-tag.outputs.tag }}" \
          ./deploy.sh

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/cohub-api -n cohub --timeout=300s
          kubectl get pods -n cohub -l app.kubernetes.io/name=cohub-api
