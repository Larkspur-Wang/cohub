name: Web Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        working-directory: apps/web

      - name: Typecheck
        run: pnpm typecheck
        working-directory: apps/web

      - name: Build
        run: pnpm build
        working-directory: apps/web

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.environment }}" == "staging" ]]; then
              echo "env=staging" >> $GITHUB_OUTPUT
            else
              echo "env=" >> $GITHUB_OUTPUT
            fi
          else
            # Default to production for push events
            echo "env=" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Cloudflare
        run: pnpm run deploy ${{ steps.env.outputs.env && format('--env {0}', steps.env.outputs.env) || '' }}
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
