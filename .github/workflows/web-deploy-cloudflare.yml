name: Web Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'packages/**'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine environment
        id: env
        run: |
          # Release 触发 → prod
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
            echo "config=wrangler.prod.toml" >> $GITHUB_OUTPUT
          # 手动触发 → 根据用户选择
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.environment }}" == "prod" ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
            echo "config=wrangler.prod.toml" >> $GITHUB_OUTPUT
          # Push main → dev
          else
            echo "env=dev" >> $GITHUB_OUTPUT
            echo "config=wrangler.toml" >> $GITHUB_OUTPUT
          fi

      - name: Setup web environment
        working-directory: apps/web
        run: |
          if [[ "${{ steps.env.outputs.env }}" == "prod" ]]; then
            echo "PUBLIC_API_ORIGIN=https://api.cohub.run" > .env
            echo "PUBLIC_GATEWAY_ORIGIN=https://gateway.cohub.run" >> .env
          else
            echo "PUBLIC_API_ORIGIN=https://api-dev.cohub.run" > .env
            echo "PUBLIC_GATEWAY_ORIGIN=https://gateway-dev.cohub.run" >> .env
          fi

      - name: Lint
        run: pnpm lint
        working-directory: apps/web

      - name: Typecheck
        run: pnpm typecheck
        working-directory: apps/web

      - name: Build
        run: pnpm build
        working-directory: apps/web

      - name: Deploy to Cloudflare
        run: pnpm run deploy --config ${{ steps.env.outputs.config }}
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}