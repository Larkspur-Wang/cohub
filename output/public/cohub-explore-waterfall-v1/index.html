<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cohub Explore</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-width:thin;scrollbar-color:var(--c-n50) transparent}
body{
  font-family:"Geist",system-ui,-apple-system,sans-serif;
  background:var(--c-bg);color:var(--c-text);
  -webkit-font-smoothing:antialiased;min-height:100vh;
}
img{display:block;max-width:100%;height:auto}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:root{
  --c-n0:oklch(94% .004 250);--c-n5:oklch(90% .005 250);--c-n10:oklch(82% .006 250);
  --c-n20:oklch(70% .008 250);--c-n30:oklch(58% .01 250);--c-n40:oklch(54% .012 250);
  --c-n50:oklch(46% .01 250);--c-n60:oklch(38% .008 250);--c-n70:oklch(32% .007 250);
  --c-n80:oklch(27% .006 250);--c-n90:oklch(22% .005 250);--c-n95:oklch(18% .004 250);
  --c-n100:oklch(14% .003 250);
  --c-b4:oklch(60% .2 30);--c-b5:oklch(55% .22 30);--c-b7:oklch(35% .16 30);--c-b9:oklch(22% .06 30);
  --c-bg:var(--c-n95);--c-surf:var(--c-n80);--c-elev:var(--c-n60);
  --c-text:var(--c-n0);--c-t2:var(--c-n10);--c-t3:var(--c-n20);--c-tp:var(--c-n30);
  --c-brd:var(--c-n70);--c-scrim:oklch(0% 0 0/.6);
  --c-ctx:oklch(72% .12 200);--c-cap:oklch(76% .14 75);--c-crt:oklch(60% .2 30);--c-evl:oklch(72% .12 240);
}
.shell{max-width:1480px;margin:0 auto;padding:0 12px}
.topbar{
  position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:12px;
  padding:8px 0;background:color-mix(in srgb,var(--c-bg) 85%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid color-mix(in srgb,var(--c-brd) 40%,transparent);
}
.brand{
  display:flex;align-items:center;gap:8px;padding:4px 8px;
  font-size:14px;font-weight:600;letter-spacing:.02em;color:var(--c-text);white-space:nowrap;
}
.brand svg{flex-shrink:0}
.search{flex:1;max-width:360px;position:relative}
.search input{
  width:100%;height:32px;padding:0 10px 0 30px;
  border:1px solid color-mix(in srgb,var(--c-brd) 50%,transparent);border-radius:6px;
  background:color-mix(in srgb,var(--c-surf) 50%,transparent);color:var(--c-text);
  font-size:13px;outline:none;transition:border-color .15s;
}
.search input::placeholder{color:var(--c-tp)}
.search input:focus{border-color:var(--c-b4)}
.search svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--c-tp);pointer-events:none}
.filters{display:flex;gap:4px;margin-left:auto}
.fbtn{
  padding:4px 10px;border-radius:5px;font-size:12px;font-weight:500;
  color:var(--c-t3);transition:all .12s;white-space:nowrap;
}
.fbtn:hover{color:var(--c-text);background:oklch(100% 0 0/.1)}
.fbtn.on{color:var(--c-b4);background:color-mix(in srgb,var(--c-b4) 12%,transparent)}
.cnt{font-size:11px;color:var(--c-tp);font-variant-numeric:tabular-nums;padding:0 4px}

.masonry{columns:6;column-gap:4px;padding:4px 0 40px}
.card{
  break-inside:avoid;margin-bottom:4px;border-radius:5px;overflow:hidden;
  position:relative;cursor:pointer;background:var(--c-surf);
  transition:transform .15s ease,box-shadow .15s ease;
}
.card:hover{transform:translateY(-1px);box-shadow:0 4px 16px oklch(0% 0 0/.35)}
.card img{width:100%;display:block;object-fit:cover}
.cov{
  position:absolute;bottom:0;left:0;right:0;padding:24px 6px 6px;
  background:linear-gradient(to top,oklch(0% 0 0/.65),transparent 100%);pointer-events:none;
}
.ct{
  font-size:11px;font-weight:600;color:#fff;line-height:1.25;letter-spacing:.01em;
  text-shadow:0 1px 3px oklch(0% 0 0/.5);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.cbadge{
  position:absolute;top:5px;right:5px;padding:2px 5px;border-radius:4px;
  font-size:9px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.b-ctx{background:color-mix(in srgb,var(--c-ctx) 25%,oklch(0% 0 0/.5));color:var(--c-ctx)}
.b-cap{background:color-mix(in srgb,var(--c-cap) 25%,oklch(0% 0 0/.5));color:var(--c-cap)}
.b-crt{background:color-mix(in srgb,var(--c-crt) 25%,oklch(0% 0 0/.5));color:var(--c-crt)}
.b-evl{background:color-mix(in srgb,var(--c-evl) 25%,oklch(0% 0 0/.5));color:var(--c-evl)}

.mscrim{
  position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;
  background:var(--c-scrim);padding:24px;animation:si .18s ease;
}
.mscrim.open{display:flex}
@keyframes si{from{opacity:0}to{opacity:1}}
@keyframes pi{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.mpanel{
  width:min(560px,100%);max-height:90vh;border-radius:12px;overflow:hidden;
  background:var(--c-n90);border:1px solid var(--c-brd);animation:pi .2s ease;
  display:flex;flex-direction:column;position:relative;
}
.mcover{width:100%;display:block;border-bottom:1px solid var(--c-brd)}
.mbody{padding:16px 20px 20px;overflow-y:auto;flex:1}
.mtitle{font-size:18px;font-weight:700;margin-bottom:4px}
.mowner{font-size:13px;color:var(--c-t3);margin-bottom:12px}
.msector{display:inline-block;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:600;margin-bottom:12px}
.msum{font-size:13px;line-height:1.65;color:var(--c-t2);margin-bottom:16px}
.mmet{display:flex;gap:16px;padding:10px 0;border-top:1px solid var(--c-brd);margin-bottom:16px}
.mmet i{font-size:11px;color:var(--c-t3);font-style:normal}
.mmet i b{color:var(--c-text);font-weight:600;margin-right:3px}
.mcta{
  display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:7px;
  background:var(--c-b4);color:#fff;font-size:13px;font-weight:600;text-decoration:none;transition:background .12s;
}
.mcta:hover{background:var(--c-b5)}
.mcls{
  position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  background:oklch(100% 0 0/.1);color:oklch(98% .003 250);backdrop-filter:blur(4px);z-index:10;
  transition:background .12s;
}
.mcls:hover{background:oklch(100% 0 0/.2)}

@media(max-width:1200px){.masonry{columns:5}}
@media(max-width:960px){.masonry{columns:4}}
@media(max-width:768px){
  .masonry{columns:2;column-gap:4px}
  .card{margin-bottom:4px}
  .search{max-width:200px}
  .filters{display:none}
  .brand span{display:none}
}
@media(max-width:480px){
  .masonry{columns:2}
  .shell{padding:0 6px}
  .topbar{padding:6px 0}
}
</style>
</head>
<body>
<div class="shell">

    <div class="brand">

      <div class="mtitle" id="mti"></div>
      <div class="mowner" id="mo"></div>
      <div class="msector" id="mse"></div>
      <div class="msum" id="msu"></div>
      <div class="mmet" id="mme"></div>

        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h7v7"/><line x1="13" y1="3" x2="7" y2="9"/></svg>
      </a>
    </div>
  </div>
</div>

function hc(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}return Math.abs(h)}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function gc(t,W,H){
  const r=rng(hc(t));
  const G={
atlas:()=>{let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a1a2e"/><stop offset="100%" stop-color="#0f0f1a"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#g)"/>`;
  for(let i=0;i<8;i++)for(let j=0;j<10;j++){const cx=j*35+(i%2)*17,cy=i*30;s+=`<polygon points="${cx},${cy-12} ${cx+10},${cy-6} ${cx+10},${cy+6} ${cx},${cy+12} ${cx-10},${cy+6} ${cx-10},${cy-6}" fill="none" stroke="${r()>.5?'#ff3e0040':'#ffffff10'}" stroke-width=".5"/>`}
  s+=`<circle cx="${W/2}" cy="${H/2}" r="28" fill="none" stroke="#ff3e00" stroke-width="1.5" opacity=".8"/><circle cx="${W/2}" cy="${H/2}" r="6" fill="#ff3e00" opacity=".9"/>`;
  s+=`<circle cx="${W/2}" cy="${H/2}" r="50" fill="none" stroke="#ff3e0030" stroke-width=".8"/><circle cx="${W/2}" cy="${H/2}" r="70" fill="none" stroke="#ff3e0020" stroke-width=".5"/></svg>`;return s},

standards:()=>{let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="#12121a"/>`;
  const cs=['#ff3e00','#ffb800','#00b4d8','#8b5cf6','#10b981'];
  for(let i=0;i<12;i++){const x=r()*W*.7,y=r()*H*.8,bw=30+r()*80,bh=20+r()*40;s+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="${cs[i%5]}${i<4?'50':'25'}"/>`}
  for(let i=0;i<5;i++)s+=`<line x1="${r()*W}" y1="${r()*H}" x2="${r()*W}" y2="${r()*H}" stroke="#ffffff15" stroke-width=".5"/>`;
  s+=`</svg>`;return s},

wiki:()=>{let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#16213e"/><stop offset="100%" stop-color="#0f1626"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#bg)"/>`;
  for(let i=0;i<4;i++){const ox=i*8,oy=i*6;s+=`<rect x="${30+ox}" y="${20+oy}" width="${W-80}" height="${H-50}" rx="4" fill="#ffffff08" stroke="#00b4d8${i===3?'60':'20'}" stroke-width="${i===3?1:.5}"/>`}
  for(let i=0;i<8;i++){const lw=40+r()*(W-120);s+=`<rect x="48" y="${40+i*16}" width="${lw}" height="4" rx="2" fill="#00b4d8${i<3?'40':'20'}"/>`}
  s+=`</svg>`;return s},

gamebuild:()=>{let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="#15101e"/>`;
  for(let x=0;x<W;x+=24)s+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="#ff3e0010" stroke-width=".5"/>`;
  for(let y=0;y<H;y+=24)s+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#ff3e0010" stroke-width=".5"/>`;
  [{x:40,y:30,w:60,h:60},{x:110,y:50,w:40,h:40},{x:60,y:100,w:80,h:30},{x:160,y:30,w:50,h:70}].forEach(b=>{
    s+=`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="3" fill="#ff3e00" opacity="${.15+r()*.25}"/>`;
    s+=`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="3" fill="none" stroke="#ff3e00" stroke-width="1" opacity=".5"/>`});

const CW=220;
function ch(t){return{atlas:220,standards:200,wiki:240,gamebuild:190,config:210,dnd:230,plainworld:200,rules:180,shanyue:250,sharingan:240,ideas:190,itch:210,bibot:200,weekly:220,product:230,creative:210,showcase:200,kairo:240,stardew:220,manage:210}[t]||200}
function bc(s){return{context_mine:'b-ctx',capability_factory:'b-cap',creation_barracks:'b-crt',eval_radar:'b-evl'}[s]||'b-ctx'}

function render(sp){
  const el=document.getElementById('ms');el.innerHTML='';
  sp.forEach((sp,i)=>{
    const h=ch(sp.c),svg=gc(sp.c,CW,h),du='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
    const d=document.createElement('div');d.className='card';d.dataset.s=sp.s;d.dataset.i=i;
    d.innerHTML=`<img src="${du}" alt="${sp.n}" width="${CW}" height="${h}" loading="${i<14?'eager':'lazy'}"><span class="cbadge ${bc(sp.s)}">${sp.sl}</span><div class="cov"><div class="ct">${sp.n}</div></div>`;
    d.addEventListener('click',()=>om(sp,du));el.appendChild(d);
  });
  document.getElementById('cnt').textContent=sp.length+' spaces';
}

const md=document.getElementById('md');
function om(sp,du){
  document.getElementById('mcv').src=du;
  document.getElementById('mti').textContent=sp.n;
  document.getElementById('mo').textContent='by '+sp.o;
  const se=document.getElementById('mse');se.textContent=sp.sl;se.className='msector '+bc(sp.s);
  document.getElementById('msu').textContent=sp.su;
  document.getElementById('mme').innerHTML=`<i><b>${sp.m.a}</b>assets</i><i><b>${sp.m.sk}</b>skills</i><i><b>${sp.m.so}</b>sources</i>`;
  document.getElementById('mct').href='https://cohub.run/spaces/'+sp.id;
  md.classList.add('open');document.body.style.overflow='hidden';
}
function cm(){md.classList.remove('open');document.body.style.overflow=''}
document.getElementById('mcl').addEventListener('click',cm);
md.addEventListener('click',e=>{if(e.target===md)cm()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')cm()});

let as='all',sq='';
function filt(){
  let f=SPACES;
  if(as!=='all')f=f.filter(s=>s.s===as);
  if(sq){const q=sq.toLowerCase();f=f.filter(s=>s.n.toLowerCase().includes(q)||s.o.toLowerCase().includes(q)||s.su.toLowerCase().includes(q))}
  render(f);
}
document.querySelectorAll('.fbtn').forEach(b=>{b.addEventListener('click',()=>{
  document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');as=b.dataset.s;filt()})});
document.getElementById('si').addEventListener('input',e=>{sq=e.target.value.trim();filt()});

render(SPACES);
</script>
