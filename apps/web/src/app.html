<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cohub</title>
    <meta name="application-name" content="Cohub" />
    <meta name="apple-mobile-web-app-title" content="Cohub" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/pwa/icon-192x192.png" />
    <script>
      (() => {
        var reservedPublicRoots = new Set([
          'callback',
          'explore',
          'invite',
          'pricing',
          'settings',
          'spaces',
          'trending'
        ]);
        var segments = location.pathname.split('/').filter(Boolean);
        var isShortcutUrl =
          (segments.length === 4 && segments[2] === 'w') ||
          (segments.length === 4 && segments[0] === 'spaces' && segments[2] === 'works') ||
          (segments[0] === 'spaces' && segments.length >= 2 && segments[1] !== 'new') ||
          (segments.length === 2 && !reservedPublicRoots.has(segments[0]));
        var href = isShortcutUrl
          ? `/shortcut.webmanifest?start_url=${encodeURIComponent(location.pathname)}`
          : '/manifest.webmanifest';
        document.write(`<link rel="manifest" href="${href}" />`);
      })();
    </script>
    <meta name="theme-color" content="#1F2026" />
    <script>
      // Prevent FOUC — resolve theme before first paint
      (() => {
        var themeColors = {
          dark: '#1F2026',
          light: '#F8F8FA',
          'solarized-dark': '#002B36',
          'solarized-light': '#FDF6E3'
        };
        var stored = localStorage.getItem('cohub-theme');
        var resolved;
        if (Object.hasOwn(themeColors, stored)) {
          resolved = stored;
        } else if (stored === 'system' || !stored) {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } else {
          resolved = 'dark';
        }
        document.documentElement.setAttribute('data-theme', resolved);
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          'content',
          themeColors[resolved]
        );
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
