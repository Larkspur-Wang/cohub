name = "netaverses-web"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2025-03-05"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".svelte-kit/cloudflare/assets"
binding = "ASSETS"

# Production defaults (deploy without --env)
[vars]
BFF_ORIGIN = "https://api.netaverses.cc"

# Staging environment
[env.staging]
name = "netaverses-web-staging"

[env.staging.vars]
BFF_ORIGIN = "https://api-staging.netaverses.cc"
