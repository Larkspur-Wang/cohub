name = "netaverses-web"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2025-03-05"

[assets]
directory = ".svelte-kit/cloudflare/assets"
binding = "ASSETS"

[vars]
# Server-side: points to the Hono BFF running on Alibaba Cloud (ACK)
BFF_ORIGIN = "https://api.netaverses.cc"

# Client-side: optional. If set to empty, the browser will call same-origin /api/*
# VITE_API_BASE_URL = ""
