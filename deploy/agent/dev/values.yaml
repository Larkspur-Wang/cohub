sessionsSubpath: sessions/dev
configsSubpath: configs/dev
sessionsNamespace: cohub-sessions-dev
agentWorkerConcurrency: "8"
agentShutdownDrainTimeoutMs: "2100000"
resourceRequestCpu: "0.1"
resourceRequestMemory: "256Mi"
resourceLimitCpu: "1"
resourceLimitMemory: "1024Mi"
