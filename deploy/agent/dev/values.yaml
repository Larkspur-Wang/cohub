appName: cohub-agent-dev
namespace: cohub-dev
serviceName: cohub-agent-dev
port: 8788
image: git.talesofai.com/talesofai/cohub-agent:main-17f713a
replicas: "1"
maxUnavailable: "0"
maxSurge: "1"
terminationGracePeriodSeconds: "2400"
imagePullPolicy: Always
env: dev
logLevel: debug
workerSecret: ""
workspaceRoot: /space-storage
sessionsDir: /sessions
platformConfigRoot: /configs
spaceStoragePvc: cohub-spaces-pvc
