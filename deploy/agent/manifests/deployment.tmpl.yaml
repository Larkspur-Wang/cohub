apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{APP_NAME}}
  namespace: {{NAMESPACE}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{APP_NAME}}
  template:
    metadata:
      labels:
        app: {{APP_NAME}}
    spec:
      imagePullSecrets:
        - name: gitea-registry
      containers:
        - name: agent
          image: {{IMAGE}}
          ports:
            - containerPort: {{PORT}}
          envFrom:
            - configMapRef:
                name: {{APP_NAME}}-config
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{APP_NAME}}-secrets
                  key: REDIS_URL
            - name: WORKER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{APP_NAME}}-secrets
                  key: WORKER_SECRET
          {{RESOURCES}}
          volumeMounts:
            - name: space-storage
              mountPath: /space-storage
              subPath: {{WORKSPACE_SUBPATH}}
            - name: space-storage
              mountPath: {{SESSIONS_DIR}}
              subPath: {{SESSIONS_SUBPATH}}
      volumes:
        - name: space-storage
          persistentVolumeClaim:
            claimName: {{SPACE_STORAGE_PVC}}
