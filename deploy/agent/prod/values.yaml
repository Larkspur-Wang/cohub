appName: cohub-agent
namespace: cohub
serviceName: cohub-agent
port: 8788
image: git.talesofai.com/talesofai/cohub-agent:v1.43.0
replicas: "4"
maxUnavailable: "0"
maxSurge: "1"
terminationGracePeriodSeconds: "86400"
imagePullPolicy: IfNotPresent
env: prod
logLevel: info
workerSecret: ""
workspaceRoot: /space-storage
sessionsDir: /sessions
platformConfigRoot: /configs
spaceStoragePvc: cohub-spaces-pvc
workspaceSubpath: workspaces/prod
sessionsSubpath: sessions/prod
configsSubpath: configs/prod
sessionsNamespace: cohub-sessions
agentWorkerConcurrency: "8"
agentShutdownDrainTimeoutMs: "86400000"
resourceRequestCpu: "0.5"
resourceRequestMemory: "512Mi"
resourceLimitCpu: "2"
resourceLimitMemory: "2Gi"
TURN_OBJECT_S3_ENDPOINT: "https://oss-us-west-1-internal.aliyuncs.com"
TURN_OBJECT_S3_REGION: "us-west-1"
TURN_OBJECT_S3_BUCKET: "cohub-sessions"
TURN_OBJECT_S3_TIMEOUT_MS: "5000"
TURN_OBJECT_S3_MAX_ATTEMPTS: "3"
TURN_OBJECT_CDN_BASE_URL: "https://sessions.cohub.run"
