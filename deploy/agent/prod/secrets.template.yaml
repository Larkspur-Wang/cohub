# Agent Prod 环境敏感配置
# 注意：请勿提交真实 secrets 到仓库
# 请复制为 secrets.yaml 并填入真实值

apiVersion: v1
kind: Secret
metadata:
  name: {{APP_NAME}}-secrets
  namespace: {{NAMESPACE}}
type: Opaque
stringData:
  # Redis 连接地址（与 API/Worker 保持一致）
  REDIS_URL: "replace-me"
  # 必填：Worker 通信密钥（与 API、Worker 保持一致）
  WORKER_SECRET: "replace-me"
