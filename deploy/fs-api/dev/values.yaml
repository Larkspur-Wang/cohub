# FS API Dev 环境配置
# 仅服务于 /api/spaces/:id/fs/* 和 /api/spaces/:id/checkpoints/:checkpointId/fs/* 路由

# ========== 基础 ==========
NAMESPACE: "cohub-dev"
APP_NAME: "cohub-fs-api-dev"
API_SECRET_NAME: "cohub-api-dev-secrets"

# ========== 镜像 ==========
IMAGE_REPOSITORY: "git.talesofai.com/talesofai/cohub-api"
IMAGE_TAG: "main-17dd201"
IMAGE_PULL_POLICY: "Always"
IMAGE_PULL_SECRET: "gitea-registry"

# ========== 服务端口 ==========
SERVICE_PORT: "8787"
CONTAINER_PORT: "8787"

# ========== 副本与资源 ==========
REPLICAS: "1"
REQUEST_CPU: "200m"
REQUEST_MEMORY: "256Mi"
LIMIT_CPU: "1000m"
LIMIT_MEMORY: "1024Mi"

# ========== 健康检查 ==========
LIVENESS_PATH: "/healthz"
LIVENESS_INITIAL_DELAY: "20"
LIVENESS_PERIOD: "10"
LIVENESS_TIMEOUT: "2"
LIVENESS_FAILURE_THRESHOLD: "3"
READINESS_PATH: "/readyz"
READINESS_INITIAL_DELAY: "5"
READINESS_PERIOD: "5"
READINESS_TIMEOUT: "2"
READINESS_FAILURE_THRESHOLD: "3"

# ========== API 配置 ==========
LOGTO_ENDPOINT: "https://dev-auth.neta.art"
LOGTO_MANAGEMENT_API_RESOURCE: "https://default.logto.app/api"
GITEA_BASE_URL: "https://gitea.cohub.run/"
GITEA_MANAGED_EMAIL_DOMAIN: "dev.cohub.run"
WEB_ORIGIN: "https://dev.cohub.run"
SANDBOX_IMAGE: "git.talesofai.com/talesofai/cohub-sandbox:latest"
SPACE_STORAGE_ROOT: "/space-storage"
SPACE_SYSTEM_ROOT: "/system-storage"
SPACE_STORAGE_PVC: "cohub-spaces-pvc"
SPACE_SYSTEM_PVC: "cohub-system-pvc"
CHECKPOINT_CACHE_PVC: "cohub-checkpoints-pvc"
SPACE_STORAGE_SUBPATH: "workspaces/dev"
SPACE_SYSTEM_SUBPATH: "dev"
CHECKPOINT_CACHE_SUBPATH: "workspaces/dev/checkpoints"
PLATFORM_CONFIG_ROOT: "/configs"
TURN_OBJECT_S3_ENDPOINT: "https://oss-us-west-1-internal.aliyuncs.com"
TURN_OBJECT_S3_REGION: "us-west-1"
TURN_OBJECT_S3_BUCKET: "cohub-sessions"
TURN_OBJECT_CDN_BASE_URL: "https://sessions.cohub.run"
PUBLIC_ASSET_OSS_ENDPOINT: "https://oss-us-west-1-internal.aliyuncs.com"
PUBLIC_ASSET_OSS_PUBLIC_ENDPOINT: "https://oss-us-west-1.aliyuncs.com"
PUBLIC_ASSET_OSS_REGION: "us-west-1"
PUBLIC_ASSET_OSS_BUCKET: "cohub-public"
PUBLIC_ASSET_CDN_BASE_URL: "https://public.cohub.run"
WORK_ASSET_CDN_BASE_URL: "https://works.cohub.run"
CONFIGS_SUBPATH: "configs/dev"

# ========== 路由配置 ==========
ROUTE_ENABLED: "true"
API_HOSTNAME: "api-dev.cohub.run"

# ========== 环境标识 ==========
ENV: "dev"
LOG_LEVEL: "debug"
MAX_UNAVAILABLE: "0"
MAX_SURGE: "1"
TERMINATION_GRACE_PERIOD_SECONDS: "120"
