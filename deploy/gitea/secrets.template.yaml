# Gitea Kubernetes Secrets 模板
#
# ⚠️ 安全警告:
# 1. 此文件包含敏感信息，切勿提交到 Git 仓库
# 2. 填写完成后，建议设置文件权限：chmod 600 secrets.yaml
# 3. 生产环境建议使用 External Secrets 或阿里云 Secrets Manager
#
# 使用说明:
# 1. 复制此文件为 secrets.yaml
# 2. 填写所有占位符（将 <xxx> 替换为实际值）
# 3. 应用：kubectl apply -f secrets.yaml -n cohub

---
# Gitea 管理员账号 Secret
apiVersion: v1
kind: Secret
metadata:
  name: gitea-admin-secret
  namespace: cohub
  labels:
    app: gitea
type: Opaque
stringData:
  # <必填> 管理员用户名
  username: "gitea_admin"
  # <必填> 管理员密码（请修改为强密码）
  password: "<CHANGE_ME_ADMIN_PASSWORD>"

---
# Gitea 核心依赖 Secret（数据库、Redis、OSS 等）
apiVersion: v1
kind: Secret
metadata:
  name: gitea-secrets
  namespace: cohub
  labels:
    app: gitea
type: Opaque
stringData:
  # ============================================================
  # RDS PostgreSQL 配置
  # ============================================================
  # <必填> 数据库密码
  rds-password: "<CHANGE_ME_RDS_PASSWORD>"

  # ============================================================
  # Redis 配置
  # ============================================================
  # <必填> Redis 连接字符串（Gitea 格式）
  # 格式说明：redis://:密码@主机:端口/0
  # 示例：redis://:MyPass123@r-bp1xxxxx.redis.rds.aliyuncs.com:6379/0
  redis-conn-str: "redis://:<CHANGE_ME_REDIS_PASSWORD>@<CHANGE_ME_REDIS_HOST>:6379/0"

  # ============================================================
  # OSS 对象存储配置（如启用 USE_OSS=true）
  # ============================================================
  # OSS AccessKey ID（如不使用 OSS，可留空或删除）
  oss-access-key-id: "<CHANGE_ME_OSS_ACCESS_KEY_ID>"
  
  # OSS AccessKey Secret
  oss-access-key-secret: "<CHANGE_ME_OSS_ACCESS_KEY_SECRET>"

  # ============================================================
  # 邮件配置（如启用邮件通知）
  # ============================================================
  # SMTP 密码（如不使用邮件，可留空或删除）
  mailer-password: "<CHANGE_ME_MAILER_PASSWORD>"

---
# （可选）OSS 存储配置 Secret - 独立管理
# 如希望将 OSS 凭证与数据库凭证分开管理，可使用此 Secret
# 并在 values.yaml 中引用
apiVersion: v1
kind: Secret
metadata:
  name: gitea-oss-secret
  namespace: cohub
  labels:
    app: gitea
type: Opaque
stringData:
  # OSS AccessKey ID
  MINIO_ACCESS_KEY_ID: "<CHANGE_ME_OSS_ACCESS_KEY_ID>"
  # OSS AccessKey Secret
  MINIO_SECRET_ACCESS_KEY: "<CHANGE_ME_OSS_ACCESS_KEY_SECRET>"
