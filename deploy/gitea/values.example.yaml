# Example deploy values. Copy to values.yaml and fill in your environment.
# Real environment values are not committed (see .gitignore).

# Gitea Helm Chart Values - 阿里云 ACK 高可用部署模板
#
# 使用说明:
# 1. 复制此文件为 values.yaml
# 2. 填写所有标注为 <必填> 的占位符
# 3. 敏感信息（密码、AK/SK）请填入 secrets.yaml
#
# 文档参考：https://gitea.com/gitea/helm-gitea

# ============================================================
# 基础配置
# ============================================================

# Gitea 副本数（HA 架构必须 >= 2）
replicaCount: 2

# 命名空间（需提前创建）
namespace: cohub

# ============================================================
# Gitea 应用配置
# ============================================================

gitea:
  # ---------- 管理员账号 ----------
  admin:
    # 管理员邮箱
    email: "dev@talesof.ai"
    # 密码模式：keepUpdated | initialOnlyNoReset | initialOnlyRequireReset
    passwordMode: keepUpdated
    # 使用 Secret 存储管理员账号（username/password）
    existingSecret: gitea-admin-secret

  # ---------- 服务器配置 ----------
  config:
    server:
      # <必填> Gitea 访问域名（不含协议）
      DOMAIN: "gitea.example.com"
      # <必填> 完整访问 URL
      ROOT_URL: "https://gitea.example.com"
      # SSH 访问域名（如启用 SSH）
      SSH_DOMAIN: "git.example.com"
      # SSH 端口（与 service.ssh.port 保持一致）
      SSH_PORT: 22
      # HTTP 端口（内部使用，无需修改）
      HTTP_PORT: 3000
      # 协议类型
      PROTOCOL: http
      # 是否启用 SSH 服务器
      START_SSH_SERVER: true

    # ---------- 数据库配置（外部 RDS）----------
    database:
      # 数据库类型：postgres | mysql | mssql
      DB_TYPE: postgres
      # <必填> RDS 内网连接地址
      HOST: "pgm-rj9nf5ql6yn31ec1.pg.rds-aliyun-america.rds.aliyuncs.com"
      # 数据库名称
      NAME: "cohub_gitea"
      # 数据库用户名
      USER: "cohub_gitea"
      # 密码通过 Secret 注入（见 secrets.yaml）
      # PASSWD 从环境变量 GITEA__DATABASE__PASSWD 读取

    # ---------- 索引器配置（HA 架构关键）----------
    indexer:
      # Issue 搜索类型：db | meilisearch | elasticsearch
      # HA 架构下不能使用 bleve（默认值），必须改为 db 或外部搜索
      ISSUE_INDEXER_TYPE: db
      # 代码内容搜索（HA 架构下必须禁用，bleve 不支持多 Pod）
      REPO_INDEXER_ENABLED: false

    # ---------- 缓存/会话/队列配置（外部 Redis）----------
    cache:
      ENABLED: true
      # 缓存适配器：redis | memcache | memory
      ADAPTER: redis

    session:
      # Session 提供者：redis | memory
      PROVIDER: redis

    queue:
      # 队列类型：redis | level
      TYPE: redis

    # ---------- 存储配置 ----------
    # 代码仓库根目录（挂载到 NAS）
    repository:
      ROOT: "/data/git/gitea-repositories"

    # 附件存储配置
    attachment:
      # 存储类型：local | minio (OSS 兼容 S3)
      STORAGE_TYPE: local
      # 最大附件大小
      MAX_SIZE: 104857600  # 100MB

    # LFS 大文件存储配置
    lfs:
      # 是否启用 LFS
      ENABLED: false
      # 存储类型：local | minio
      STORAGE_TYPE: local

    # 头像存储配置
    picture:
      AVATAR_STORAGE_TYPE: local

    # Packages 注册表配置
    packages:
      ENABLED: true
      STORAGE_TYPE: local

    # Gitea Actions (CI/CD) 配置
    actions:
      # 是否启用 Actions
      ENABLED: false
      # 是否允许仓库启用 Actions
      DEFAULT_ACTIONS_CONFIG_LEVEL: false

    # 联合认证（Fediverse）
    federation:
      ENABLED: false

    # 安全配置
    security:
      # 安装锁定（必须为 true）
      INSTALL_LOCK: true
      # 密码复杂度要求（可选）
      # PASSWORD_COMPLEXITY: lower,upper,digit,special

    # 其他配置
    service:
      # 是否允许用户注册
      DISABLE_REGISTRATION: false
      # 注册需要邮件确认
      REGISTER_EMAIL_CONFIRM: false
      # 允许本地账号登录
      ALLOW_ONLY_EXTERNAL_REGISTRATION: false
      ENABLE_PASSWORD_SIGNIN_FORM: true
      SHOW_REGISTRATION_BUTTON: true

  # ---------- 通过环境变量注入敏感配置 ----------
  # 优先级高于 gitea.config，用于从 Secret 读取密码
  additionalConfigFromEnvs:
    # 数据库密码
    - name: GITEA__DATABASE__PASSWD
      valueFrom:
        secretKeyRef:
          name: gitea-secrets
          key: rds-password
    # Redis 连接字符串（用于缓存/会话/队列）
    - name: GITEA__CACHE__HOST
      valueFrom:
        secretKeyRef:
          name: gitea-secrets
          key: redis-conn-str
    - name: GITEA__SESSION__PROVIDER_CONFIG
      valueFrom:
        secretKeyRef:
          name: gitea-secrets
          key: redis-conn-str
    - name: GITEA__QUEUE__CONN_STR
      valueFrom:
        secretKeyRef:
          name: gitea-secrets
          key: redis-conn-str

  # ---------- 健康检查配置 ----------
  livenessProbe:
    enabled: true
    tcpSocket:
      port: http
    initialDelaySeconds: 200
    periodSeconds: 10
    failureThreshold: 10

  readinessProbe:
    enabled: true
    tcpSocket:
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3

  startupProbe:
    enabled: true
    tcpSocket:
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 30

  # 指标监控（可选）
  metrics:
    enabled: false
    # token: ""  # 如设置则需 bearer token 访问

# ============================================================
# 服务配置
# ============================================================

service:
  http:
    # HTTP 服务类型（Gateway/Traefik 模式下使用 ClusterIP）
    type: ClusterIP
    port: 3000
    # 留空表示不指定 clusterIP
    clusterIP: ""

  ssh:
    # SSH 服务类型（如启用 SSH，使用 LoadBalancer 创建 CLB）
    # 如不需要 SSH，改为 ClusterIP
    type: LoadBalancer
    port: 22
    clusterIP: ""
    # 保留客户端真实 IP
    externalTrafficPolicy: Local

# ============================================================
# Ingress 配置
# ============================================================
# 本部署使用 Kubernetes Gateway + Traefik，禁用 Helm Chart 内置 Ingress
ingress:
  enabled: false

# ============================================================
# 持久化存储配置（阿里云 NAS）
# ============================================================

persistence:
  enabled: true
  create: true
  # <必填> NAS StorageClass 名称（需支持 RWX）
  storageClass: "cohub-gitea-nas"
  # 访问模式（HA 架构必须为 ReadWriteMany）
  accessModes:
    - ReadWriteMany
  # PVC 容量（NAS 按实际使用计费，可设大一些）
  size: 1000Gi
  # 标签
  labels: {}
  # 注解
  annotations: {}

# ============================================================
# 资源限制
# ============================================================

resources:
  # 根据用户规模调整
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 2Gi

# ============================================================
# 镜像配置
# ============================================================

image:
  registry: "docker.gitea.com"
  repository: gitea
  tag: ""  # 留空使用 Chart 默认版本
  pullPolicy: IfNotPresent
  # 使用无根镜像（更安全）
  rootless: true

# ============================================================
# 安全上下文
# ============================================================

podSecurityContext:
  fsGroup: 1000

containerSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  # 如使用 cri-o 容器运行时，需添加 SYS_CHROOT 能力
  # capabilities:
  #   add:
  #     - SYS_CHROOT

# ============================================================
# 内置依赖组件（全部禁用，使用阿里云托管服务）
# ============================================================

# 禁用内置 Valkey 集群（使用阿里云 Redis）
valkey-cluster:
  enabled: false

valkey:
  enabled: false

# 禁用内置 PostgreSQL（使用阿里云 RDS）
postgresql:
  enabled: false

postgresql-ha:
  enabled: false

# 禁用内置 MinIO（如使用 OSS 则不需要）
minio:
  enabled: false

# 禁用内置 Meilisearch（使用 db 作为索引器）
meilisearch:
  enabled: false

# ============================================================
# 其他可选配置
# ============================================================

# 节点选择器（可选）
nodeSelector: {}

# 容忍度（可选）
tolerations: []

# 亲和性（可选）
affinity: {}

# Pod 中断预算（可选，HA 建议配置）
podDisruptionBudget:
  minAvailable: 1

# ServiceAccount 配置
serviceAccount:
  create: false
  name: ""
