# Workspace API 敏感配置模板
# 注意：请勿提交真实 secrets.yaml 到仓库

apiVersion: v1
kind: Secret
metadata:
  name: netaverses-api-secrets
  namespace: netaverses
stringData:
  # 数据库连接地址
  DATABASE_URL: "postgres://user:pass@host:5432/netaverses"
  # Redis 连接地址
  REDIS_URL: "redis://redis-service:6379"
  # LiteLLM API key (用于 Agent 调用 LLM)
  LITELLM_API_KEY: "sk-xxx"
  # 可选：访问私有仓库时使用
  gitea-token: "CHANGE_ME_OR_EMPTY"
