apiVersion: v1
kind: ServiceAccount
metadata:
  name: netaverses-api
  namespace: netaverses
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: netaverses-api-sessions-manager
  namespace: netaverses-sessions
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: netaverses-api-sessions-manager
  namespace: netaverses-sessions
subjects:
  - kind: ServiceAccount
    name: netaverses-api
    namespace: netaverses
roleRef:
  kind: Role
  name: netaverses-api-sessions-manager
  apiGroup: rbac.authorization.k8s.io