apiVersion: apps/v1
kind: Deployment
metadata:
  name: netaverses-api
  namespace: netaverses
  labels:
    app.kubernetes.io/name: netaverses-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netaverses-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netaverses-api
    spec:
      containers:
        - name: netaverses-api
          image: registry.cn-shanghai.aliyuncs.com/talesofai/netaverses-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8787
              name: http
          envFrom:
            - configMapRef:
                name: netaverses-api-config
            - secretRef:
                name: netaverses-api-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
