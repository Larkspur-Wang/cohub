apiVersion: apps/v1
kind: Deployment
metadata:
  name: __APP_NAME__
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: __APP_NAME__
spec:
  replicas: __REPLICAS__
  selector:
    matchLabels:
      app.kubernetes.io/name: __APP_NAME__
  template:
    metadata:
      labels:
        app.kubernetes.io/name: __APP_NAME__
    spec:
      serviceAccountName: __APP_NAME__
__IMAGE_PULL_SECRETS_BLOCK__
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: __APP_NAME__
          image: __IMAGE_REPOSITORY__:__IMAGE_TAG__
          imagePullPolicy: __IMAGE_PULL_POLICY__
          envFrom:
            - configMapRef:
                name: __APP_NAME__-config
            - secretRef:
                name: __SECRET_NAME__
          volumeMounts:
            - name: space-storage
              mountPath: /space-storage
              subPath: __SPACE_STORAGE_SUBPATH__
            - name: checkpoint-cache
              mountPath: /checkpoint-cache
            - name: system-storage
              mountPath: /system-storage
            - name: space-storage
              mountPath: /configs
              subPath: __CONFIGS_SUBPATH__
          resources:
            requests:
              cpu: "__REQUEST_CPU__"
              memory: "__REQUEST_MEMORY__"
            limits:
              cpu: "__LIMIT_CPU__"
              memory: "__LIMIT_MEMORY__"
      volumes:
        - name: space-storage
          persistentVolumeClaim:
            claimName: __SPACE_STORAGE_PVC__
        - name: checkpoint-cache
          persistentVolumeClaim:
            claimName: __CHECKPOINT_CACHE_PVC__
        - name: system-storage
          persistentVolumeClaim:
            claimName: __SPACE_SYSTEM_PVC__
